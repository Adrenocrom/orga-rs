[package]
name = "orga-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only what is used: multi-thread runtime + #[tokio::main], TCP listener,
# ctrl-c/SIGTERM handlers for graceful shutdown, child-process supervision
# for agent runs (process + io-util), run timeouts (time) and the
# cancellation channel (sync).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "time", "sync"] }
ureq = { version = "2.12", features = ["json"] }
# ReceiverStream/BroadcastStream: wrap the live run event channels as
# Streams for axum's SSE response body ("sync" enables the broadcast one).
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
